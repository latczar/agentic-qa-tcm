name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, format, compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run manifest:check
      - run: npm run format:check
      - name: Validate Docker Compose file
        run: docker compose config -q

  framework-e2e:
    name: playwright suite against HR Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/e2e-framework/playwright-report
          retention-days: 7

  integration:
    name: integration against Postgres (mock TCM repository, pipeline scenario matrix)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiqa
          POSTGRES_PASSWORD: aiqa
          POSTGRES_DB: tcm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiqa -d tcm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
        env:
          # One database for both apps in CI; the table names do not clash.
          DATABASE_URL: postgres://aiqa:aiqa@localhost:5432/tcm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-artifacts
          path: artifacts/integration-runs
          retention-days: 7

  # Manual only: proves the Ollama wiring still works end to end on a fresh machine. Not a
  # quality gate and never blocks a merge — phase 6 already found and documented that this model
  # doesn't reliably pass every gate from scratch (see docs/results.md), so a low pass rate here
  # is expected, not a CI failure. What this job actually checks is infrastructure: install,
  # pull, health check, a full generate-validate-retry cycle against the real HR Portal.
  bench-ollama:
    name: real-model bench (manual, informational)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull the model
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 2
          done
          ollama pull qwen2.5-coder:7b
      - name: Bench against a single case, curated mode (CPU inference is slow; this is a wiring smoke test, not a benchmark)
        run: npm run pipeline -- bench --provider ollama --cases TC-014 --out docs/results-ci.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ollama-bench-results
          path: |
            docs/results-ci.md
            artifacts/runs
          retention-days: 14
